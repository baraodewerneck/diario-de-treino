<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11151b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<title>Treino ULPPL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#eef1f5;--sf:#fff;--sf2:#e4e9f0;--tx:#141a24;--mu:#667186;--ac:#2457e6;--ai:#fff;--ok:#12926b;--bd:#d5dce7;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151b;--sf:#1a2029;--sf2:#252d39;--tx:#eef2f8;--mu:#8c97aa;--ac:#7fb0ff;--ai:#0c1220;--ok:#3ddba5;--bd:#2b3442;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151b;--sf:#1a2029;--sf2:#252d39;--tx:#eef2f8;--mu:#8c97aa;--ac:#7fb0ff;--ai:#0c1220;--ok:#3ddba5;--bd:#2b3442;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:500 15px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:18px 16px 110px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;letter-spacing:.01em}
h1{font-size:40px;line-height:1;margin:6px 0 2px}
h2{font-size:22px;margin:22px 0 10px}
.mu{color:var(--mu);font-size:13px}
.in>*{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.in>*:nth-child(2){animation-delay:.05s}.in>*:nth-child(3){animation-delay:.1s}.in>*:nth-child(4){animation-delay:.15s}.in>*:nth-child(n+5){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translate(var(--dx,0px),12px)}}
.days{display:flex;gap:6px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;background:var(--sf);border:1px solid var(--bd);font-weight:600;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--ac);color:var(--ai);border-color:var(--ac)}
.bar{height:6px;background:var(--sf2);border-radius:9px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.ex{padding:20px 0 12px;border-top:1px solid var(--bd)}
.ex.full .nm{color:var(--ok)}
.hd{display:flex;gap:10px;align-items:center}
.rt{flex:none;min-width:76px;padding:5px 12px;border-radius:99px;border:1px solid var(--bd);font:700 17px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;color:var(--mu);transition:background .25s,color .25s,transform .15s}
.rt:active{transform:scale(.94)}
.rt.go{background:var(--ac);color:var(--ai);border-color:var(--ac)}
.nm{width:100%;background:transparent;border:0;padding:0;font-weight:600;font-size:17px;border-radius:0}
.nm:focus{outline:0;color:var(--ac)}
.meta{display:flex;gap:12px;margin:6px 0 8px;color:var(--mu);font-size:13px}
.s{display:grid;grid-template-columns:20px 1fr 1fr 38px;gap:14px;align-items:center;margin:4px 0}
.s b{font:700 20px "Barlow Condensed",sans-serif;color:var(--mu);text-align:center}
.s input{width:100%;height:40px;border-radius:0;background:transparent;border:0;border-bottom:1.5px solid var(--bd);text-align:center;font:700 22px "Barlow Condensed",sans-serif;transition:border-color .2s}
.s input:focus{outline:0;border-color:var(--ac)}
.s input::placeholder{color:var(--mu);opacity:.55;font-weight:600}
.ck{width:32px;height:32px;border-radius:50%;border:2px solid var(--bd);position:relative;transition:background .2s,border-color .2s,transform .2s}
.ck:after{content:"";position:absolute;left:9px;top:4px;width:6px;height:12px;border:solid transparent;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);transition:border-color .2s}
.ck.on{background:var(--ok);border-color:var(--ok);animation:pop .35s}
.ck.on:after{border-color:var(--bg)}
@keyframes pop{50%{transform:scale(1.18)}}
.row{display:flex;gap:8px;margin-top:4px}
.mini{padding:6px 12px;border-radius:99px;border:1px solid var(--bd);font-size:13px;font-weight:600}
.mini:active{transform:scale(.94)}
.box{background:var(--sf);border-radius:22px;padding:16px;margin-top:12px}
svg{width:100%;height:auto;display:block;overflow:visible}
.ln{fill:none;stroke:var(--ac);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s .1s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.ar{opacity:0;animation:fi .8s .6s forwards}
@keyframes fi{to{opacity:1}}
.bs{fill:var(--ac);opacity:.85;transform-box:fill-box;transform-origin:bottom;animation:gr .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes gr{from{transform:scaleY(0)}}
.tx{fill:var(--mu);font:11px Barlow,sans-serif}
.dt{fill:var(--sf);stroke:var(--ac);stroke-width:2}
.sel{width:100%;height:46px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);padding:0 12px}
.st{display:flex;gap:10px;margin-top:12px}
.st div{flex:1;background:var(--sf);border-radius:16px;padding:10px 12px}
.st .num{font-size:28px;line-height:1.1;display:block}
.big{font-size:84px;line-height:.95}
.big small{font-size:28px;color:var(--mu);font-weight:600}
.in2{display:flex;gap:8px;margin-top:12px}
.in2 input{flex:1;height:48px;border-radius:14px;background:var(--sf);border:2px solid var(--bd);padding:0 14px;font-size:18px}
.in2 input:focus{outline:0;border-color:var(--ac)}
.btn{padding:0 20px;height:48px;border-radius:14px;background:var(--ac);color:var(--ai);font-weight:700}
.btn:active{transform:scale(.95)}
.li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border:0}
.g{display:grid;grid-template-columns:22px repeat(12,1fr);gap:4px;margin-top:6px}
.g i{font:normal 600 11px Barlow,sans-serif;color:var(--mu);text-align:center;line-height:20px}
.c{aspect-ratio:1;border-radius:6px;background:var(--sf2);transition:background .2s,transform .15s}
.c:active{transform:scale(.8)}
.c.on{background:var(--ac)}
.c.td{box-shadow:0 0 0 2px var(--tx)}
.yr{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);display:flex;gap:4px;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0}
nav:after{content:"";position:absolute;top:-1px;left:calc(12px + (100% - 24px) * (2 * var(--i,0) + 1) / 10 - 16px);width:32px;height:3px;border-radius:3px;background:var(--ac);transition:left .4s cubic-bezier(.3,1.2,.4,1)}
nav button{flex:1;padding:13px 0 11px;border-radius:14px;color:var(--mu);font-size:14px;font-weight:600;transition:color .25s,background .25s}
nav button span{font-size:20px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
nav button.on{color:var(--ac);background:var(--sf)}
nav button.on span{transform:translateY(-2px) scale(1.15)}
.em{text-align:center;color:var(--mu);padding:26px 0}
#ts{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5}
#ts.sh{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ts" role="status"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0'),
iso=d=>{d=d||new Date;return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())},T=iso(),
esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'),
DN=['Upper','Lower','Push','Pull','Legs'],
PR=[['Supino Inclinado com Halteres|5|8–10|2|2–2,5 min','Puxada Alta Pegada Pronada|5|8–10|2|2–2,5 min','Elevação Lateral com Halteres|3|12–15|1–2|1,5 min','Rosca Direta Barra W|3|10–12|1–2|1,5 min','Tríceps Testa na Polia|3|10–12|1–2|1,5 min'],
['Agachamento Livre com Barra|4|6–8|2|2,5–3 min','Cadeira Extensora|3|10–12|1|1,5 min','Stiff com Halteres / Barra|5|8–10|2|2 min','Gêmeos em Pé no Aparelho|4|12–15|1|1,5 min'],
['Supino Reto com Barra|4|6–8|2|2,5–3 min','Crossover na Polia Média|3|12–15|1|1,5 min','Desenvolvimento com Halteres|4|8–10|2|2 min','Tríceps Corda na Polia|4|10–12|1|1,5 min'],
['Remada Curvada com Barra|4|8–10|2|2–2,5 min','Pulldown Braços Estendidos|3|12–15|1|1,5 min','Crucifixo Invertido no Pec Deck|3|12–15|1|1,5 min','Rosca Inclinada com Halteres|4|10–12|1–2|1,5 min'],
['Leg Press 45°|4|8–10|2|2,5 min','Passada / Afundo com Halteres|3|10–12 por perna|1–2|2 min','Mesa Flexora|5|10–12|1|1,5 min','Gêmeos Sentado no Aparelho|4|12–15|1|1,5 min']];
let S=null;try{S=JSON.parse(localStorage.getItem('ulppl1'))}catch(e){}
if(!S)S={tab:'t',day:Math.min(4,(new Date().getDay()+6)%7),
ex:PR.map((d,i)=>d.map((x,j)=>{x=x.split('|');return{id:'d'+i+'e'+j,name:x[0],sets:+x[1],reps:x[2],rir:x[3],rest:x[4]}})),
log:{},w:[[T,75]],hn:['Treinei','Creatina 5g','Água 3,5 L','3 refeições'],hd:[{},{},{},{}],hi:0,yr:new Date().getFullYear(),sel:'d0e0',m:'r'};
const save=()=>{try{localStorage.setItem('ulppl1',JSON.stringify(S))}catch(e){}},
all=()=>S.ex.flat(),A=$('#app'),
rs=e=>{const m=String(e.rest).replace(',','.').match(/[\d.]+/);return Math.round((m?parseFloat(m[0]):1.5)*60)},
fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+p2(s%60)};
function prev(id,i){const ds=Object.keys(S.log).filter(d=>d<T).sort().reverse();for(const d of ds){const s=(S.log[d][id]||[])[i];if(s&&(s.k||s.r))return s}return{}}
function prog(){let t=0,d=0;const L=S.log[T]||{};S.ex[S.day].forEach(e=>{t+=e.sets;for(let i=0;i<e.sets;i++)if(((L[e.id]||[])[i]||{}).d)d++});return[d,t]}
function vT(){const L=S.log[T]=S.log[T]||{},[d,t]=prog();
return`<h1>${DN[S.day]}</h1><div class="mu">Hoje, ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div>
<div class="days">${DN.map((n,i)=>`<button class="chip ${i==S.day?'on':''}" data-a="day" data-i="${i}">Dia ${i+1} ${n}</button>`).join('')}</div>
<div class="bar"><i id="pb" style="width:${t?d/t*100:0}%"></i></div><div class="mu" id="pt">${d} de ${t} séries concluídas</div>`+
S.ex[S.day].map((e,xi)=>{const l=L[e.id]||[];let ok=0,r='';
for(let i=0;i<e.sets;i++){const s=l[i]||{},pv=prev(e.id,i);if(s.d)ok++;
r+=`<div class="s"><b>${i+1}</b><input inputmode="decimal" placeholder="${pv.k||'kg'}" value="${s.k||''}" data-a="k" data-x="${xi}" data-i="${i}" aria-label="Carga"><input inputmode="numeric" placeholder="${pv.r||'reps'}" value="${s.r||''}" data-a="r" data-x="${xi}" data-i="${i}" aria-label="Repetições"><button class="ck ${s.d?'on':''}" data-a="ck" data-x="${xi}" data-i="${i}" aria-label="Concluir série"></button></div>`}
const on=S.tm&&S.tm.id==e.id;
return`<div class="ex ${ok==e.sets?'full':''}"><div class="hd"><input class="nm" value="${esc(e.name)}" data-a="n" data-x="${xi}" aria-label="Nome do exercício"><button class="rt ${on?'go':''}" data-a="tm" data-x="${xi}" aria-label="Timer de descanso">${fmt(on?Math.max(0,S.tm.end-Date.now()):rs(e)*1000)}</button></div>
<div class="meta"><span>${e.sets}×${e.reps}</span><span>RIR ${e.rir}</span><span>Descanso ${e.rest}</span></div>${r}
<div class="row"><button class="mini" data-a="add" data-x="${xi}">+ série</button><button class="mini" data-a="rm" data-x="${xi}">− série</button></div></div>`}).join('')}
function line(pts){if(!pts.length)return'<div class="em">Conclua séries com carga para ver o gráfico.</div>';
const W=320,H=160,P=28,ys=pts.map(a=>a[1]),mn=Math.min(...ys),mx=Math.max(...ys),r=(mx-mn)||1,n=pts.length,
X=i=>n<2?W/2:P+i*(W-2*P)/(n-1),Y=v=>H-P-(v-mn)/r*(H-2*P-8);
const d=pts.map((a,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(a[1]).toFixed(1)).join('');
return`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ac)" stop-opacity=".3"/><stop offset="1" style="stop-color:var(--ac)" stop-opacity="0"/></linearGradient></defs>
<path class="ar" d="${d}L${X(n-1)} ${H-P}L${X(0)} ${H-P}Z" fill="url(#g)"/><path class="ln" pathLength="1" d="${d}"/>
${pts.map((a,i)=>`<circle class="dt" cx="${X(i)}" cy="${Y(a[1])}" r="4"/>`).join('')}
<text class="tx" x="0" y="${Y(mx)+4}">${+mx.toFixed(1)}</text><text class="tx" x="0" y="${Y(mn)+4}">${+mn.toFixed(1)}</text>
<text class="tx" x="${P}" y="${H-6}">${pts[0][0].slice(8)}/${pts[0][0].slice(5,7)}</text><text class="tx" text-anchor="end" x="${W-P}" y="${H-6}">${pts[n-1][0].slice(8)}/${pts[n-1][0].slice(5,7)}</text></svg>`}
function bars(pts){if(!pts.length)return'';const W=320,H=110,mx=Math.max(...pts.map(a=>a[1]))||1,w=Math.min(26,(W-20)/pts.length-4);
return`<svg viewBox="0 0 ${W} ${H}">${pts.map((a,i)=>{const h=a[1]/mx*(H-20),x=10+i*((W-20)/pts.length)+2;return`<rect class="bs" style="animation-delay:${i*.04}s" x="${x}" y="${H-12-h}" width="${w}" height="${h}" rx="5"/>`}).join('')}<text class="tx" x="10" y="${H}">${pts[0][0].slice(8)}/${pts[0][0].slice(5,7)}</text><text class="tx" text-anchor="end" x="${W-10}" y="${H}">${pts[pts.length-1][0].slice(8)}/${pts[pts.length-1][0].slice(5,7)}</text></svg>`}
function vE(){if(!all().some(e=>e.id==S.sel))S.sel=all()[0].id;
const rows=Object.keys(S.log).sort().map(d=>{const s=(S.log[d][S.sel]||[]).filter(x=>x&&x.d&&+x.k>0);if(!s.length)return null;
return{d,k:Math.max(...s.map(x=>+x.k)),r:Math.max(...s.map(x=>x.k*(1+(+x.r||1)/30))),v:s.reduce((a,x)=>a+x.k*(+x.r||0),0)}}).filter(Boolean),
key=S.m=='k'?'k':'r',pts=rows.map(x=>[x.d,+x[key].toFixed(1)]),f=rows[0],l=rows[rows.length-1],
dl=f&&l&&f[key]?Math.round((l[key]/f[key]-1)*100):0;
return`<h1>Evolução</h1><div class="mu">Acompanhe a carga ao longo das sessões</div>
<select class="sel" style="margin-top:14px" data-a="sel">${S.ex.map((d,i)=>`<optgroup label="Dia ${i+1} ${DN[i]}">${d.map(e=>`<option value="${e.id}" ${e.id==S.sel?'selected':''}>${esc(e.name)}</option>`).join('')}</optgroup>`).join('')}</select>
<div class="days"><button class="chip ${key=='r'?'on':''}" data-a="m" data-v="r">1RM estimado</button><button class="chip ${key=='k'?'on':''}" data-a="m" data-v="k">Maior carga</button></div>
<div class="st"><div><span class="num">${l?+l[key].toFixed(1):'–'}</span><span class="mu">kg agora</span></div><div><span class="num" style="color:${dl>=0?'var(--ok)':'var(--tx)'}">${dl>0?'+':''}${dl}%</span><span class="mu">desde o início</span></div><div><span class="num">${rows.length}</span><span class="mu">sessões</span></div></div>
<div class="box">${line(pts)}</div><h2>Volume por sessão</h2><div class="box">${rows.length?bars(rows.map(x=>[x.d,x.v])):'<div class="em">Sem sessões registradas.</div>'}</div>
<div class="mu" style="margin-top:8px">1RM estimado pela fórmula de Epley. Volume é carga × repetições.</div>`}
function vP(){const w=[...S.w].sort(),c=w[w.length-1],f=w[0],dd=c?+(c[1]-f[1]).toFixed(1):0,
days=c?(new Date(c[0])-new Date(f[0]))/864e5:0,rate=days>=7?(dd/days*7):null,okr=rate!==null&&rate>=.25&&rate<=.5;
return`<h1>Peso</h1><div class="mu">Meta: ganhar de 0,25 a 0,5 kg por semana</div>
<div class="box"><div class="num big">${c?c[1]:'–'}<small> kg</small></div>
<div class="mu">${c?(dd>=0?'+':'')+dd+' kg desde '+f[0].split('-').reverse().join('/'):''}${rate!==null?`, ritmo de <b style="color:${okr?'var(--ok)':'var(--tx)'}">${rate.toFixed(2)} kg por semana</b>`:''}</div></div>
<div class="in2"><input id="wi" inputmode="decimal" placeholder="Peso de hoje em kg" aria-label="Peso de hoje"><button class="btn" data-a="aw">Salvar</button></div>
<div class="box">${line(w.map(x=>[x[0],+x[1]]))}</div><h2>Registros</h2><div class="box">${w.slice(-8).reverse().map(x=>`<div class="li"><span>${x[0].split('-').reverse().join('/')}</span><b>${x[1]} kg</b><button class="mini" data-d="${x[0]}" data-a="dw">Apagar</button></div>`).join('')}</div>`}
function vH(){const h=S.hd[S.hi],y=S.yr;let g='<i></i>'+[...'JFMAMJJASOND'].map(m=>`<i>${m}</i>`).join('');
for(let d=1;d<=31;d++){g+=`<i>${d}</i>`;for(let m=0;m<12;m++){const k=y+'-'+p2(m+1)+'-'+p2(d);g+=d>new Date(y,m+1,0).getDate()?'<i></i>':`<button class="c ${h[k]?'on':''} ${k==T?'td':''}" data-a="hc" data-k="${k}" aria-label="${d}/${m+1}"></button>`}}
const n=Object.keys(h).filter(k=>k.startsWith(y)).length;let st=0,dt=new Date;if(!h[iso(dt)])dt.setDate(dt.getDate()-1);while(h[iso(dt)]){st++;dt.setDate(dt.getDate()-1)}
const e=Math.max(1,Math.min(366,Math.floor((new Date()-new Date(y,0,0))/864e5))),tot=y<new Date().getFullYear()?365:y>new Date().getFullYear()?1:e;
return`<h1>Hábitos</h1><div class="mu">Toque em um dia para marcar</div>
<div class="days">${S.hn.map((n,i)=>`<button class="chip ${i==S.hi?'on':''}" data-a="hs" data-i="${i}">${h==S.hd[i]&&S.hd[i][T]||S.hd[i][T]?'✓ ':''}${esc(n)}</button>`).join('')}</div>
<div class="in2"><input value="${esc(S.hn[S.hi])}" data-a="hn" aria-label="Nome do hábito"><button class="btn" data-a="ht">${h[T]?'Desmarcar hoje':'Marcar hoje'}</button></div>
<div class="st"><div><span class="num">${n}</span><span class="mu">dias no ano</span></div><div><span class="num">${st}</span><span class="mu">dias seguidos</span></div><div><span class="num">${Math.round(n/tot*100)}%</span><span class="mu">do ano</span></div></div>
<div class="yr"><button class="mini" data-a="yr" data-v="-1">‹ ${y-1}</button><h2 style="margin:0">${y}</h2><button class="mini" data-a="yr" data-v="1">${y+1} ›</button></div><div class="g box" style="padding:12px">${g}</div>`}
const TABS=[['t','🏋️','Treino',vT],['e','📈','Evolução',vE],['p','⚖️','Peso',vP],['h','🔥','Hábitos',vH],['b','','Dados',vB]];
function vB(){const n=Object.keys(S.log).length,e=S.lastExp?S.lastExp.split('-').reverse().join('/'):null;
return`<h1>Dados</h1><div class="mu">Tudo fica salvo neste aparelho. Exporte um backup de tempos em tempos.</div>
<div class="st"><div><span class="num">${n}</span><span class="mu">dias de treino</span></div><div><span class="num">${S.w.length}</span><span class="mu">pesagens</span></div></div>
<div class="box"><b>Backup</b><div class="mu" style="margin:4px 0 14px">${e?'Último backup em '+e+'.':'Você ainda não exportou nenhum backup.'}</div>
<div class="row"><button class="btn" style="flex:1" data-a="exp">Exportar backup</button><button class="btn" style="flex:1;background:var(--sf2);color:var(--tx)" data-a="imp">Importar backup</button></div>
<input type="file" id="fi" accept=".json,application/json" data-a="fi" style="display:none"></div>
<div class="mu" style="margin-top:12px">Ao importar, os dados atuais deste aparelho são substituídos pelos do arquivo.</div>`}
function render(an){A.innerHTML=TABS.find(t=>t[0]==S.tab)[3]();$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]==S.tab?'on':''}" data-a="tab" data-t="${t[0]}">${t[2]}</button>`).join('');$('#nav').style.setProperty('--i',TABS.findIndex(t=>t[0]==S.tab));A.style.setProperty('--dx',(an&&an!==1?an:0)+'px');
if(an){A.classList.add('in');setTimeout(()=>A.classList.remove('in'),900)}save()}
function setS(x,i,f,v){const e=S.ex[S.day][x],L=S.log[T]=S.log[T]||{},a=L[e.id]=L[e.id]||[];a[i]=a[i]||{};a[i][f]=v;return a[i]}
function mark(){S.hd[0][T]=1}
function act(el){const a=el.dataset.a,x=+el.dataset.x,i=+el.dataset.i;
if(a=='tab'){const o=TABS.findIndex(t=>t[0]==S.tab),n=TABS.findIndex(t=>t[0]==el.dataset.t);if(o==n)return;S.tab=el.dataset.t;scrollTo(0,0);render(n>o?40:-40)}
else if(a=='day'){const o=S.day;if(o==i)return;S.day=i;render(i>o?40:-40)}
else if(a=='ck'){const e=S.ex[S.day][x],s=setS(x,i,'d',!((((S.log[T]||{})[e.id]||[])[i]||{}).d)),pv=prev(e.id,i);
if(s.d){if(!s.k&&pv.k)s.k=pv.k;if(!s.r&&pv.r)s.r=pv.r;mark();S.tm={id:e.id,end:Date.now()+rs(e)*1000}}render()}
else if(a=='tm'){const e=S.ex[S.day][x];S.tm=S.tm&&S.tm.id==e.id?null:{id:e.id,end:Date.now()+rs(e)*1000};render()}
else if(a=='add'){S.ex[S.day][x].sets++;render()}
else if(a=='rm'){const e=S.ex[S.day][x];if(e.sets>1){e.sets--;const l=(S.log[T]||{})[e.id];if(l)l.length=Math.min(l.length,e.sets)}render()}
else if(a=='m'){S.m=el.dataset.v;render()}
else if(a=='aw'){const v=parseFloat($('#wi').value.replace(',','.'));if(v>0){S.w=S.w.filter(r=>r[0]!=T);S.w.push([T,+v.toFixed(1)]);render(1)}}
else if(a=='dw'){S.w=S.w.filter(r=>r[0]!=el.dataset.d);render()}
else if(a=='hs'){S.hi=i;render()}
else if(a=='ht'){const h=S.hd[S.hi];h[T]?delete h[T]:h[T]=1;render()}
else if(a=='hc'){const h=S.hd[S.hi],k=el.dataset.k;h[k]?delete h[k]:h[k]=1;el.classList.toggle('on');save();const b=$('.st');if(b){const y=document.createElement('div');y.innerHTML=vH();$('.st').innerHTML=y.querySelector('.st').innerHTML;$('.in2 .btn').textContent=h[T]?'Desmarcar hoje':'Marcar hoje'}}
else if(a=='yr'){S.yr+=+el.dataset.v;render(1)}
else if(a=='exp')expo();
else if(a=='imp')$('#fi').click()}
A.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&b.tagName=='BUTTON')act(b)});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b)});
A.addEventListener('input',e=>{const t=e.target,a=t.dataset.a;
if(a=='n')S.ex[S.day][+t.dataset.x].name=t.value;
else if(a=='k'||a=='r')setS(+t.dataset.x,+t.dataset.i,a,t.value.replace(',','.'));
else if(a=='hn')S.hn[S.hi]=t.value;
else return;save()});
A.addEventListener('change',e=>{const t=e.target;if(t.dataset.a=='sel'){S.sel=t.value;render(1)}else if(t.dataset.a=='fi')impFile(t.files[0],t)});
function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('sh');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('sh'),2400)}
function expo(){S.lastExp=T;save();const b=new Blob([JSON.stringify({app:'treino-ulppl',v:1,exported:new Date().toISOString(),data:S},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='treino-backup-'+T+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4e3);render();toast('Backup exportado')}
function impFile(f,inp){if(!f)return;const r=new FileReader;r.onload=()=>{try{const j=JSON.parse(r.result),d=j.data||j;if(!d||!Array.isArray(d.ex)||!d.log||typeof d.log!='object'||!Array.isArray(d.w)||!Array.isArray(d.hd)||!Array.isArray(d.hn))throw 0;
if(!confirm('Substituir os dados atuais por este backup? ('+Object.keys(d.log).length+' dias de treino, '+d.w.length+' pesagens)'))return;
S=Object.assign({day:0,hi:0,yr:new Date().getFullYear(),sel:'d0e0',m:'r'},d,{tab:'b',tm:null});save();render(1);toast('Backup importado')}catch(e){alert('Arquivo inválido. Escolha um backup exportado por este app.')}inp.value=''};r.readAsText(f)}
function tick(){const t=S.tm;if(!t)return;const l=t.end-Date.now(),b=document.querySelector('.rt.go');if(l>0){if(b)b.textContent=fmt(l);return}
S.tm=null;save();try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}
if(b){const e=all().find(x=>x.id==t.id);b.classList.remove('go');if(e)b.textContent=fmt(rs(e)*1000)}}
setInterval(tick,250);
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(iso()!=T)location.reload();else tick()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render(1);
</script>
</body>
</html>
