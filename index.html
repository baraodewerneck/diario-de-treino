<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário de Treino</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5bea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#14213d;--mu:#66708a;--ac:#2f5bea;--ac2:#dfe6fd;--bd:#dce1ec;--ok:#1f9d73;--bad:#d1495b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1320;--card:#171f33;--tx:#e8ecf7;--mu:#8e99b5;--ac:#6f93ff;--ac2:#25325c;--bd:#27314c;--ok:#3ccf9b;--bad:#ff7b8c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1320;--card:#171f33;--tx:#e8ecf7;--mu:#8e99b5;--ac:#6f93ff;--ac2:#25325c;--bd:#27314c;--ok:#3ccf9b;--bad:#ff7b8c}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px 14px 84px;max-width:560px;margin:0 auto}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.2px}
h1{font-size:30px}h2{font-size:23px;margin:14px 0 8px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.nm{font-weight:600;font-size:17px}
.chips{display:flex;gap:6px;margin:10px 0}
.chip,.btn,nav button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 6px;cursor:pointer}
.chip{flex:1;font-weight:600;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;width:100%;padding:13px;margin:8px 0}
.btn.s{background:var(--card);color:var(--ac);width:auto;padding:8px 14px;margin:0}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px;width:100%;min-width:0}
.ins{display:flex;gap:8px;margin-top:8px}
.f{flex:1;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mu)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav2{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.nav2 b{font-weight:600}
.up{color:var(--ok)}.dn{color:var(--bad)}
.lst{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd);cursor:pointer}
.lst:first-child{border-top:0}
.sc{overflow-x:auto}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mu);font:11px Barlow,sans-serif}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);max-width:560px;margin:0 auto}
nav button{flex:1;border:0;font-size:13px;color:var(--mu);background:none;position:relative;z-index:1}
nav button.on{color:var(--ac);font-weight:600}
.mons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mn{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.d{aspect-ratio:1;border-radius:5px;font-size:10px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--mu);cursor:pointer;user-select:none}
.d.on{background:var(--ok);color:#fff;font-weight:600}
.d.t{outline:2px solid var(--ac);outline-offset:1px}
.d.e{background:none;cursor:default}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.s{opacity:1;transform:translate(-50%,0)}

/* animações e edição de nomes */
.nm{display:flex;align-items:center;gap:6px}.nt{flex:1;min-width:0}
.ib{font:inherit;width:34px;height:34px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--bd);background:var(--bg);color:var(--mu);border-radius:9px;cursor:pointer;padding:0;font-size:15px}
.ib.ok{background:var(--ok);border-color:var(--ok);color:#fff}
input.ne{flex:1;font-weight:600;padding:7px 9px;animation:fade .25s both}
input,select,textarea{transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
.chip,.btn,nav button,.ib,.d{transition:transform .16s cubic-bezier(.3,.7,.4,1),background-color .28s,color .28s,border-color .28s,box-shadow .28s}
.chip:active,.btn:active,.ib:active,nav button:active{transform:scale(.94)}
.d:active{transform:scale(.8)}
@media (hover:hover){.btn:hover{box-shadow:0 6px 16px rgba(47,91,234,.3);transform:translateY(-1px)}.chip:hover,.ib:hover{border-color:var(--ac)}}
.btn.ok{background:var(--ok);border-color:var(--ok);animation:pop .45s}
.d.pop{animation:pop .35s}
.lst{transition:background-color .2s}.lst:active{background:var(--ac2)}
#ind{position:absolute;top:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:0;background:var(--ac2);border-radius:10px;z-index:0;transition:transform .38s cubic-bezier(.3,.8,.3,1),width .38s cubic-bezier(.3,.8,.3,1)}
nav button.on{transition-delay:.05s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ptin{from{opacity:0}to{opacity:1}}
#v.tr{animation:inR .38s cubic-bezier(.2,.8,.2,1) both}
#v.tl{animation:inL .38s cubic-bezier(.2,.8,.2,1) both}
#v.soft{animation:fade .28s cubic-bezier(.2,.8,.2,1) both}
#v.tr .card,#v.tl .card,#v.soft .card,#v.tr .mn,#v.tl .mn,#v.soft .mn{animation:up .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s .1s ease-out forwards}
.pt{opacity:0;animation:ptin .4s ease forwards;animation-delay:calc(.25s + var(--i,0)*.07s)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style></head><body>
<h1>Diário de Treino</h1>
<div id="v"></div>
<div id="toast"></div>
<nav id="nv"></nav>
<script>
const PLAN=[
{n:"Dia 1 · Upper",s:"Upper",e:["Supino Inclinado com Halteres|5|8–10|RIR 2|2–2,5 min","Puxada Alta Pegada Pronada|5|8–10|RIR 2|2–2,5 min","Elevação Lateral com Halteres|3|12–15|RIR 1–2|1,5 min","Rosca Direta com Barra W|3|10–12|RIR 1–2|1,5 min","Tríceps Testa na Polia|3|10–12|RIR 1–2|1,5 min"]},
{n:"Dia 2 · Lower",s:"Lower",e:["Agachamento Livre com Barra|4|6–8|RIR 2|2,5–3 min","Cadeira Extensora|3|10–12|RIR 1|1,5 min","Stiff com Halteres / Barra|5|8–10|RIR 2|2 min","Gêmeos em Pé no Aparelho|4|12–15|RIR 1|1,5 min"]},
{n:"Dia 3 · Push",s:"Push",e:["Supino Reto com Barra|4|6–8|RIR 2|2,5–3 min","Crossover na Polia Média|3|12–15|RIR 1|1,5 min","Desenvolvimento com Halteres|4|8–10|RIR 2|2 min","Tríceps Corda na Polia|4|10–12|RIR 1|1,5 min"]},
{n:"Dia 4 · Pull",s:"Pull",e:["Remada Curvada com Barra|4|8–10|RIR 2|2–2,5 min","Pulldown na Polia (Braços Estendidos)|3|12–15|RIR 1|1,5 min","Crucifixo Invertido no Pec Deck|3|12–15|RIR 1|1,5 min","Rosca Inclinada com Halteres|4|10–12|RIR 1–2|1,5 min"]},
{n:"Dia 5 · Legs",s:"Legs",e:["Leg Press 45°|4|8–10|RIR 2|2,5 min","Passada / Afundo com Halteres|3|10–12 por perna|RIR 1–2|2 min","Mesa Flexora|5|10–12|RIR 1|1,5 min","Gêmeos Sentado (Aparelho)|4|12–15|RIR 1|1,5 min"]}];
PLAN.forEach((d,i)=>d.e=d.e.map((x,j)=>{const a=x.split('|');return{id:'d'+i+'e'+j,n:a[0],m:a[1]+' séries · '+a[2]+' reps · '+a[3]+' · '+a[4]}}));
const ALL=PLAN.flatMap((d,i)=>d.e.map(e=>({...e,dn:d.s})));
const $=s=>document.querySelector(s);
let S={sessions:{},weights:{},habit:{},names:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('ft1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ft1',JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const P=s=>{const a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])};
const mon=s=>{const d=P(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=s=>pad(P(s).getDate())+'/'+pad(P(s).getMonth()+1);
const fN=v=>(Math.round(v*10)/10).toString().replace('.',',');
const num=s=>{const v=parseFloat(String(s).replace(',','.'));return isNaN(v)?null:v};
const today=iso(new Date());
const sd=Object.keys(S.sessions).sort();
let tab='t',day=sd.length?(S.sessions[sd[sd.length-1]].day+1)%5:0,date=today,exSel='d0e0',wk=mon(today),wwk=mon(today),wdate=today,yr=new Date().getFullYear();
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';setTimeout(()=>t.className='',1800)}
function last(id,f){const ds=Object.keys(S.sessions).filter(d=>d!==date).sort().reverse();for(const d of ds){const x=S.sessions[d].ex[id];if(x&&x[f]!=null)return x[f]}return null}
function series(id){const m={};for(const d in S.sessions){const x=S.sessions[d].ex[id];if(x&&x.w!=null){const w=mon(d);m[w]=Math.max(m[w]||0,x.w)}}return Object.keys(m).sort().map(k=>[k,m[k]])}
function chart(pts,o){
const W=340,H=170,L=36,R=12,T=16,B=26,n=o.labels.length;
if(!pts.length)return'<p class="mu">Sem registros ainda.</p>';
const vs=pts.map(p=>p.v);if(o.avg!=null)vs.push(o.avg);
let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<1){lo-=.5;hi+=.5}
const pd=(hi-lo)*.18;lo-=pd;hi+=pd;
const X=i=>n==1?(L+W-R)/2:L+i*(W-L-R)/(n-1),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
let s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
for(let k=0;k<3;k++){const v=lo+(hi-lo)*k/2,y=Y(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--bd)"/><text x="'+(L-5)+'" y="'+(y+4)+'" text-anchor="end">'+fN(v)+'</text>'}
o.labels.forEach((l,i)=>{s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+l+'</text>'});
if(o.avg!=null)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(o.avg)+'" y2="'+Y(o.avg)+'" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5 4"/><text x="'+(W-R)+'" y="'+(Y(o.avg)-5)+'" text-anchor="end" style="fill:var(--ok);font-weight:600">média '+fN(o.avg)+'</text>';
s+='<polyline class="ln" pathLength="1" fill="none" stroke="var(--ac)" stroke-width="2.5" points="'+pts.map(p=>X(p.i)+','+Y(p.v)).join(' ')+'"/>';
pts.forEach((p,k)=>{s+='<g class="pt" style="--i:'+k+'"><circle cx="'+X(p.i)+'" cy="'+Y(p.v)+'" r="4" fill="var(--ac)"/><text x="'+X(p.i)+'" y="'+(Y(p.v)-8)+'" text-anchor="middle" style="fill:var(--tx)">'+fN(p.v)+'</text></g>'});
return s+'</svg>'}
const DR={};
const esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nm=e=>S.names[e.id]||e.n;
const dk=(id,f)=>date+'|'+day+'|'+id+'|'+f;
const TABS=[['t','Treino'],['p','Evolução'],['w','Peso'],['y','Ano']];
const nameRow=e=>'<span class="nt">'+esc(nm(e))+'</span><button class="ib" onclick="editName(\''+e.id+'\')" aria-label="Editar nome do exercício">✎</button>';
function rT(){
const D=PLAN[day],ss=S.sessions[date],cur=ss&&ss.day==day?ss.ex:{};
const inp=(id,f,lb)=>{const d=DR[dk(id,f)],v=d!==undefined?d:(cur[id]&&cur[id][f]!=null?fN(cur[id][f]):''),ph=last(id,f);return'<label class="f">'+lb+'<input id="i_'+id+'_'+f+'" inputmode="decimal" value="'+esc(v)+'" placeholder="'+(ph!=null?fN(ph):'kg')+'"></label>'};
return'<div class="chips">'+PLAN.map((d,i)=>'<button class="chip '+(i==day?'on':'')+'" onclick="day='+i+';R(\'soft\')">'+d.s+'</button>').join('')+'</div>'+
'<div class="row"><h2>'+D.n+'</h2><input type="date" value="'+date+'" style="width:auto" onchange="date=this.value||today;if(S.sessions[date])day=S.sessions[date].day;R(\'soft\')"></div>'+
(ss?'<p class="mu">Treino já registrado nesta data. Edite e salve para atualizar.</p>':'<p class="mu">Os valores em cinza são a última carga registrada. Toque em ✎ para renomear um exercício.</p>')+
D.e.map((e,j)=>'<div class="card" style="--i:'+j+'"><div class="nm" id="nm_'+e.id+'">'+nameRow(e)+'</div><div class="mu">'+e.m+'</div><div class="ins">'+(j==0?inp(e.id,'a1','Aquec. 1 (kg)')+inp(e.id,'a2','Aquec. 2 (kg)'):'')+inp(e.id,'w','Trabalho (kg)')+'</div></div>').join('')+
'<button class="btn" id="sv" onclick="saveS()">Salvar treino</button>'}
function editName(id){
const el=$('#nm_'+id);if(!el||el.querySelector('input'))return;
const e=ALL.find(x=>x.id==id);
el.innerHTML='<input class="ne" maxlength="60" value="'+esc(nm(e))+'" placeholder="'+esc(e.n)+'" aria-label="Nome do exercício"><button class="ib ok" onclick="nameOk(\''+id+'\')" aria-label="Salvar nome">✓</button><button class="ib" onclick="nameShow(\''+id+'\')" aria-label="Cancelar">✕</button>';
const i=el.querySelector('input');i.focus();i.select();
i.onkeydown=ev=>{if(ev.key==='Enter')nameOk(id);if(ev.key==='Escape')nameShow(id)}}
function nameShow(id){$('#nm_'+id).innerHTML=nameRow(ALL.find(x=>x.id==id))}
function nameOk(id){
const e=ALL.find(x=>x.id==id),v=$('#nm_'+id+' input').value.trim().slice(0,60);
if(!v||v===e.n){delete S.names[id]}else S.names[id]=v;
save();nameShow(id);toast(v&&v!==e.n?'Nome atualizado':'Nome original restaurado')}
function flash(id,txt,orig){const b=$(id);if(!b)return;b.textContent=txt;b.classList.add('ok');setTimeout(()=>{if(b.isConnected){b.textContent=orig;b.classList.remove('ok')}},1400)}
function saveS(){
const ex={};let any=false;
PLAN[day].e.forEach(e=>{const o={};['w','a1','a2'].forEach(f=>{const el=$('#i_'+e.id+'_'+f);if(el){const v=num(el.value);if(v!=null){o[f]=v;any=true}}});if(Object.keys(o).length)ex[e.id]=o});
if(!any){toast('Preencha ao menos uma carga');return}
S.sessions[date]={day,ex};S.habit[date]=true;
Object.keys(DR).forEach(k=>{if(k.indexOf(date+'|'+day+'|')==0)delete DR[k]});
save();R();flash('#sv','Salvo ✓','Salvar treino')}
function wMax(id,w){let m=null;for(let i=0;i<7;i++){const x=S.sessions[addD(w,i)];if(x&&x.ex[id]&&x.ex[id].w!=null)m=Math.max(m||0,x.ex[id].w)}return m}
function rP(){
const sr=series(exSel).slice(-12),pts=sr.map((a,i)=>({i,v:a[1]}));
let n=0;for(let i=0;i<7;i++)if(S.sessions[addD(wk,i)])n++;
let h='<h2>Evolução da carga</h2><select onchange="exSel=this.value;R(\'soft\')">'+ALL.map(e=>'<option value="'+e.id+'" '+(e.id==exSel?'selected':'')+'>'+esc(e.dn+' · '+nm(e))+'</option>').join('')+'</select><div class="card">'+chart(pts,{labels:sr.map(a=>fmt(a[0]))})+'<p class="mu" style="margin:4px 0 0">Maior carga de trabalho por semana (kg), semanas iniciadas na segunda.</p></div>';
h+='<h2>Visão da semana</h2><div class="nav2"><button class="btn s" onclick="wk=addD(wk,-7);R(\'tl\')">‹</button><b>'+fmt(wk)+' – '+fmt(addD(wk,6))+'</b><button class="btn s" onclick="wk=addD(wk,7);R(\'tr\')">›</button></div><p class="mu">'+n+(n==1?' treino':' treinos')+' nesta semana. Toque num exercício para ver o gráfico.</p><div class="card" style="--i:1">';
ALL.forEach(e=>{const c=wMax(e.id,wk);if(c==null)return;const pv=series(e.id).filter(a=>a[0]<wk).pop();let d='';if(pv){const df=c-pv[1];d=df==0?'<span class="mu">= '+fN(pv[1])+'</span>':'<span class="'+(df>0?'up':'dn')+'">'+(df>0?'▲ +':'▼ ')+fN(df)+'</span>'}
h+='<div class="lst" onclick="exSel=\''+e.id+'\';R(\'soft\');scrollTo({top:0,behavior:\'smooth\'})"><span>'+esc(nm(e))+'<br><span class="mu">'+e.dn+'</span></span><span style="text-align:right"><b>'+fN(c)+' kg</b><br>'+d+'</span></div>'});
if(!n)h+='<p class="mu" style="margin:0">Nenhum treino registrado nesta semana.</p>';
return h+'</div>'}
function wAvg(ws){let s=0,c=0;for(let i=0;i<7;i++){const v=S.weights[addD(ws,i)];if(v!=null){s+=v;c++}}return c?s/c:null}
function rW(){
const pts=[];for(let i=0;i<7;i++){const v=S.weights[addD(wwk,i)];if(v!=null)pts.push({i,v})}
const avg=wAvg(wwk),pa=wAvg(addD(wwk,-7));
const ws=[...new Set(Object.keys(S.weights).map(mon))].sort().reverse().slice(0,8);
let h='<h2>Peso corporal</h2><div class="card"><div class="ins"><label class="f">Data<input type="date" value="'+wdate+'" onchange="wdate=this.value||today;R()"></label><label class="f">Peso (kg)<input id="wv" inputmode="decimal" value="'+(S.weights[wdate]!=null?fN(S.weights[wdate]):'')+'" placeholder="ex.: 75,4"></label></div><button class="btn" id="sw" onclick="saveW()">Salvar peso</button><p class="mu" style="margin:0">Deixe vazio e salve para apagar o registro da data.</p></div>'+
'<div class="nav2"><button class="btn s" onclick="wwk=addD(wwk,-7);R(\'tl\')">‹</button><b>'+fmt(wwk)+' – '+fmt(addD(wwk,6))+'</b><button class="btn s" onclick="wwk=addD(wwk,7);R(\'tr\')">›</button></div><div class="card" style="--i:1">'+chart(pts,{labels:['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],avg})+
(avg!=null?'<p style="margin:6px 0 0"><b>Média da semana: '+fN(avg)+' kg</b>'+(pa!=null?' <span class="'+(avg-pa>=0?'up':'dn')+'">('+(avg-pa>=0?'+':'')+fN(avg-pa)+' kg vs. semana anterior)</span>':'')+'</p>':'')+'</div>';
if(ws.length)h+='<h2>Médias semanais</h2><div class="card" style="--i:2">'+ws.map(w=>{const a=wAvg(w),p=wAvg(addD(w,-7)),d=p!=null?a-p:null;return'<div class="lst" onclick="wwk=\''+w+'\';R(\'soft\');scrollTo({top:0,behavior:\'smooth\'})"><span>Semana de '+fmt(w)+'</span><span><b>'+fN(a)+' kg</b> '+(d!=null?'<span class="'+(d>=0?'up':'dn')+'">'+(d>=0?'+':'')+fN(d)+'</span>':'')+'</span></div>'}).join('')+'</div>';
return h}
function saveW(){const v=num($('#wv').value);if(v==null)delete S.weights[wdate];else S.weights[wdate]=v;save();toast(v==null?'Registro apagado':'Peso salvo');R();flash('#sw',v==null?'Apagado ✓':'Salvo ✓','Salvar peso')}
